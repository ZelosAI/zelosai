apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Default install: namespace + CRDs + RBAC + manager Deployment.
# Override `system` -> `zelos-system` so ClusterRoleBinding subjects resolve.

namespace: zelos-system

resources:
- ../crd
- ../rbac
- ../manager

namePrefix: zelosai-

labels:
- includeSelectors: false
  pairs:
    app.kubernetes.io/managed-by: zelosai
    app.kubernetes.io/part-of: zelos
