kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: zelosclients.zelos.zelosai.io
spec:
  group: zelos.zelosai.io
  names:
    categories:
    - zelos
    kind: ZelosClient
    listKind: ZelosClientList
    plural: zelosclients
    shortNames:
    - zcl
    singular: zelosclient
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.runtime
      name: Runtime
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .spec.inCluster
      name: InCluster
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ZelosClient is the worker bridging backplane topics to local
          vLLM/Ollama.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ZelosClientSpec defines the inference worker that subscribes to backplane topics.
              Default deployment path is Ansible/host (zelos.dgx). InCluster=true opts into a
              DaemonSet on labeled GPU nodes.
            properties:
              autoscaling:
                description: Autoscaling provisions an HPA targeting the rendered
                  Deployment.
                properties:
                  maxReplicas:
                    format: int32
                    minimum: 1
                    type: integer
                  minReplicas:
                    format: int32
                    minimum: 1
                    type: integer
                  targetCPUUtilization:
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                required:
                - maxReplicas
                - minReplicas
                type: object
              backplaneRef:
                description: BackplaneRef names a ZelosBackplane in the same namespace.
                type: string
              config:
                additionalProperties:
                  type: string
                description: Config keys are rendered to a ConfigMap mounted as envFrom.
                type: object
              image:
                description: |-
                  ImageSpec describes a container image to pull. Repository defaults to
                  ghcr.io/zelosai/<component> when empty. See docs/architecture/10-image-registry.md.
                properties:
                  pullPolicy:
                    description: PullPolicy is the imagePullPolicy applied to the
                      rendered container.
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  repository:
                    description: Repository is the full image repository, e.g. ghcr.io/zelosai/zelosgateway.
                    type: string
                  tag:
                    description: Tag is the image tag. Defaults to the operator's
                      component default.
                    type: string
                type: object
              imagePullSecrets:
                description: ImagePullSecrets are passed through to every Pod the
                  operator renders.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              inCluster:
                description: InCluster opts into an in-cluster DaemonSet on nodes
                  matching nodeSelector.
                type: boolean
              logLevel:
                description: LogLevel overrides the OTEL_LOG_LEVEL applied to the
                  pod.
                enum:
                - trace
                - debug
                - info
                - warn
                - error
                type: string
              model:
                description: Model is the model identifier to load.
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                type: object
              persistence:
                description: Persistence, when enabled, provisions a PVC mounted at
                  /var/lib/zelos/<component>/.
                properties:
                  accessModes:
                    description: AccessModes defaults to [ReadWriteOnce].
                    items:
                      type: string
                    type: array
                  enabled:
                    description: Enabled toggles PVC creation. Defaults to false when
                      omitted.
                    type: boolean
                  size:
                    default: 1Gi
                    description: Size is the requested storage capacity (e.g. "1Gi").
                    type: string
                  storageClassName:
                    description: StorageClassName overrides the cluster default storage
                      class.
                    type: string
                type: object
              replicas:
                format: int32
                type: integer
              resources:
                description: ResourceRequirements describes the compute resource requirements.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              runtime:
                description: Runtime selects the local inference runtime.
                enum:
                - vllm
                - ollama
                type: string
              runtimeURL:
                description: RuntimeURL is the local inference endpoint (e.g. http://localhost:8000).
                type: string
              secretRefs:
                description: SecretRefs project Secret keys as files under /etc/zelos/secrets/.
                items:
                  description: |-
                    SecretMount projects a single key from an existing Secret into the pod
                    at /etc/zelos/secrets/<key> by default, and exposes the file path via an
                    env var (default ZELOS<COMPONENT>_<KEY>_FILE).
                  properties:
                    env:
                      description: Env overrides the env var name used to expose the
                        file path.
                      type: string
                    key:
                      description: Key is the data key inside the Secret.
                      type: string
                    name:
                      description: Name is the Secret name in the same namespace as
                        the CR.
                      type: string
                    path:
                      description: Path overrides the default file mount path (/etc/zelos/secrets/<key>).
                      type: string
                  required:
                  - key
                  - name
                  type: object
                type: array
              service:
                description: ServiceSpec controls the Service the operator creates
                  for the workload.
                properties:
                  port:
                    format: int32
                    type: integer
                  type:
                    default: ClusterIP
                    description: Service Type string describes ingress methods for
                      a service
                    enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                    type: string
                type: object
              subscribeTopics:
                description: SubscribeTopics lists backplane topics this client claims
                  work from.
                items:
                  type: string
                type: array
              tolerations:
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
            type: object
          status:
