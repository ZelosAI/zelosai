                  logLevel:
                    default: info
                    description: LogLevel is the default OTEL_LOG_LEVEL applied to
                      all components.
                    enum:
                    - trace
                    - debug
                    - info
                    - warn
                    - error
                    type: string
                type: object
            type: object
          status:
            description: ZelosPlatformStatus captures the suite-level reconcile status.
            properties:
              children:
                description: |-
                  Children lists the per-component CRs the suite currently owns, each
                  with its rolled-up readiness so operators can see component health
                  without describing every child CR.
                items:
                  description: |-
                    ChildRef is a reference to an owned per-component CR plus its rolled-up
                    readiness as observed by the umbrella reconciler.
                  properties:
                    kind:
                      description: Kind is the child CR Kind (e.g. ZelosGateway).
                      type: string
                    message:
                      description: |-
                        Message is a human-readable explanation of the child's current
                        readiness (e.g. "2/2 replicas available").
                      type: string
                    name:
                      description: Name is the child CR name.
                      type: string
                    ready:
                      description: |-
                        Ready is the string form of the child's Ready condition status
                        ("True"/"False"/"Unknown").
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              conditions:
                description: |-
                  Conditions captures the standard Kubernetes-convention conditions
                  (Available, Ready, Progressing) for the resource. Managed via
                  meta.SetStatusCondition so transition times and observedGeneration
                  follow the upstream apimachinery semantics.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is a short, human-readable summary of where the install is in
                  its lifecycle (e.g. Pending, Progressing, Ready, Degraded). It is
                  derived from the conditions and is intended for `kubectl get` display
                  only; automation should read the conditions.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
