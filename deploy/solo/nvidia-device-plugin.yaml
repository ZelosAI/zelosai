# NVIDIA Kubernetes device-plugin DaemonSet.
#
# solo is the ONLY Zelos topology that runs an in-cluster GPU workload (the
# zelosclient Pod), so it is the only one that needs the device-plugin inside
# Kubernetes (see 14-deployment-strategies.md → "NVIDIA device-plugin placement").
# The plugin discovers the DGX's GPUs through the host NVIDIA driver + container
# toolkit and advertises them to the kubelet as the `nvidia.com/gpu` extended
# resource, which the client Pod can then request.
#
# PREREQUISITES on the DGX (NOT installed by this manifest):
#   * NVIDIA datacenter driver loaded on the host.
#   * nvidia-container-toolkit installed and the container runtime configured to
#     use the `nvidia` runtime (k3s: containerd auto-detects it; otherwise set
#     `default_runtime_name = "nvidia"`).
# This manifest pins the plugin to `kube-system` (the conventional home for
# node-level system DaemonSets); it is intentionally NOT namespaced into `zelos`.
#
# Upstream reference: https://github.com/NVIDIA/k8s-device-plugin (v0.17.x).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
  labels:
    app.kubernetes.io/name: nvidia-device-plugin
    app.kubernetes.io/part-of: zelos
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-device-plugin
    spec:
      # Run only where a GPU runtime is present; harmless on a single-GPU DGX
      # but keeps the plugin off any non-GPU node added later.
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      priorityClassName: system-node-critical
      runtimeClassName: nvidia
      containers:
      - name: nvidia-device-plugin-ctr
        image: nvcr.io/nvidia/k8s-device-plugin:v0.17.1
        env:
        - name: FAIL_ON_INIT_ERROR
          value: "false"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
