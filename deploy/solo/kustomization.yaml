apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# `solo` deployment overlay — single NVIDIA DGX running k3s with EVERY component
# (operator-managed control plane PLUS the zelosclient inference worker) on the one
# box. The developer's workstation only connects in. See
# docs/architecture/14-deployment-strategies.md.
#
# Layers on deploy/minimum/ (namespace + example Secrets/ConfigMap + the `default`
# ZelosPlatform) and:
#   * patches the platform CR to single-node sizing and enables the in-cluster
#     zelosclient (client.inCluster=true) with a vLLM runtime,
#   * installs the NVIDIA k8s device-plugin DaemonSet so the client Pod can
#     request nvidia.com/gpu,
#   * exposes the gateway to the workstation via a Traefik Ingress on the k3s
#     NodePort (30080).
#
# Apply AFTER `kubectl apply -k deploy/operator/`. See README.md for prerequisites.
#
# NOTE: no top-level `namespace:` transform here — deploy/minimum/ already pins its
# resources to `zelos`, and the NVIDIA device-plugin deliberately lives in
# `kube-system`. Each added resource carries its own namespace explicitly.

resources:
- ../minimum
- nvidia-device-plugin.yaml
- gateway-ingress.yaml

patches:
- path: zelosplatform-patch.yaml
  target:
    group: zelos.zelosai.io
    version: v1alpha1
    kind: ZelosPlatform
    name: default
