# Throwaway placeholder Secrets for the kind e2e smoke ONLY.
#
# The component images are the e2e stub with pullPolicy: Never, so the GHCR
# pull secret is never actually used to pull anything — it exists only so the
# rendered pods' imagePullSecrets reference resolves. The mcp auth Secret is
# similarly a dummy: the stub ignores it. NONE of this is real credential
# material; do not copy this pattern into a real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: zelos
type: kubernetes.io/dockerconfigjson
data:
  # echo -n '{"auths":{}}' | base64
  .dockerconfigjson: eyJhdXRocyI6e319
---
apiVersion: v1
kind: Secret
metadata:
  name: zelos-mcp-auth
  namespace: zelos
type: Opaque
stringData:
  auth.key: "e2e-not-a-real-fernet-key"
  providers.json: |
    {"github": {"client_id": "e2e", "client_secret": "e2e", "scopes": ["read:user"]}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zelos-mcp-servers
  namespace: zelos
data:
  mcpServers.json: |
    {"mcpServers": {}}
