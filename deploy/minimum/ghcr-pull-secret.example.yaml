# GHCR pull secret. Replace `<base64-dockerconfigjson>` with the value of:
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<github-user-or-org> \
#     --docker-password=<PAT-with-read:packages> \
#     --docker-email=<email> \
#     --dry-run=client -o yaml | yq '.data[".dockerconfigjson"]'
#
# Then base64-encode the resulting .dockerconfigjson value into the field below.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: zelos
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64-dockerconfigjson>
